[workspace]
members = ["crates/srr-launcher"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# The shared launcher SDK. To move to a new release, change the tag here and
# rerun `scripts/sdk-sync` from that SDK checkout (see AGENTS.md).
rea-launcher = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.4.4" }
rea-launcher-win32 = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.4.4" }
rea-launcher-ui = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.4.4" }
rea-launcher-build = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.4.4" }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
strip = true
