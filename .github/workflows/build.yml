name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # The shared rea-launcher-sdk CI: formatting, host tests, cargo audit and
  # deny, sdk/ drift, shell syntax and the Linux helper tests, Windows-target
  # clippy, the release build, the import-resolution test, packaging and the
  # package allowlist.
  ci:
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/launcher-ci.yml@v0.3.0
    with:
      apt-packages: gcc-mingw-w64-i686 lld zip unzip
      clippy-args: ""
      wine-tests: true
      shell-tests: linux/tests/*.sh packaging/tests/*.sh
      imports-test: SRR_LAUNCHER_EXE="$REA_RELEASE_DIR/SRRLauncher.exe" cargo test --locked --test imports -- --ignored
      package-command: |
        sh packaging/package.sh "$REA_VERSION_NAME" dist "$REA_RELEASE_DIR"
        # The AppImage carries DXVK where SRRLauncher.exe looks for it.
        appimage="$PWD/dist/SRRLauncher-$REA_VERSION_NAME-x86_64.AppImage"
        (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract >/dev/null &&
          test -f squashfs-root/usr/lib/srr/linux/d3d9.dll &&
          test -f squashfs-root/usr/lib/srr/rea-play.sh && rm -rf squashfs-root)
      package-dir: dist/SRRLauncher-*.zip
      package-allowlist: packaging/package.allow
      artifact-name: SRRLauncher-packages
      artifact-paths: |
        dist/*.zip
        dist/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/launcher-release.yml@v0.3.0
    with:
      package: srr-launcher
      artifact-pattern: SRRLauncher-*
