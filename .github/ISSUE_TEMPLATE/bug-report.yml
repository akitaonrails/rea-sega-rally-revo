name: Bug report
description: "SRRLauncher.exe does not run Sega Rally Revo as it should (test reports welcome too)."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Reports that everything works are useful too. Never attach
        SEGA Rally.exe, SEGA Rally_SSE1.exe, DLLs, saves, media or any other game files.
        Remove usernames and personal paths from settings and logs.
  - type: dropdown
    id: system
    attributes:
      label: Where did you play?
      options:
        - Windows 11
        - Windows 10
        - Steam Deck (Game Mode)
        - Steam Deck (Desktop Mode)
        - Linux with Steam / Proton
        - Linux with the AppImage
        - Linux with Wine and srr-play
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: The first line of launcher.log, e.g. "SRRLauncher 0.1.1".
    validations:
      required: true
  - type: dropdown
    id: exe
    attributes:
      label: Which game executable?
      options:
        - Clean SEGA Rally_SSE1.exe (stutter fix available)
        - Full-rip NoDVD SEGA Rally.exe
        - Both
        - Rejected as unknown (use the Unknown edition form instead)
  - type: textarea
    id: sha256
    attributes:
      label: SHA-256 of SEGA Rally.exe and SEGA Rally_SSE1.exe
      description: |
        The lines launcher.log writes for SEGA Rally.exe and SEGA Rally_SSE1.exe (they start
        with the file name and end with "SHA-256 …"). Or: Windows `certutil -hashfile "SEGA Rally.exe" SHA256`,
        Linux `sha256sum "SEGA Rally.exe"`. Never attach the executable itself.
      render: text
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: CPU, graphics card, controller and screen
      description: e.g. "Ryzen 7 7800X3D, RTX 3060, Xbox-style pad, 2560x1440 at 144 Hz".
  - type: checkboxes
    id: worked
    attributes:
      label: What worked?
      options:
        - label: The settings window opened
        - label: The title screen and menus showed (no main-menu crash)
        - label: A full race could be driven
        - label: Gamepad (steering, pedals, buttons)
        - label: Smooth frame pacing (stutter fix / frame limit)
        - label: Widescreen / ultra-wide picture
        - label: Saves and settings survived another launch
        - label: The game closed cleanly
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead (or "everything worked").
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings used
      description: The look and anything you changed, or launcher.cfg without personal paths.
  - type: textarea
    id: log
    attributes:
      label: launcher.log
      description: |
        Windows: %LOCALAPPDATA%\SRRLauncher\launcher.log. Under Wine or Proton it is inside
        the prefix (srr-play and the AppImage: ~/.local/share/srr-launcher/prefix).
        Remove personal paths before posting.
      render: text
    validations:
      required: true
