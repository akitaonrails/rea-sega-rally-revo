name: Test report
description: Tell us how DiRTLauncher runs on your PC, working or not.
title: "Test report: "
labels: ["test report"]
body:
  - type: markdown
    attributes:
      value: |
        Reports that everything works are useful too. Never attach game files.
  - type: dropdown
    id: system
    attributes:
      label: Where did you play?
      options:
        - Windows 11
        - Windows 10
        - Steam Deck (Game Mode)
        - Steam Deck (Desktop Mode)
        - Linux with Steam / Proton
        - Linux with the AppImage
        - Linux with Wine and dirt-play
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: The first line of launcher.log, e.g. "DiRTLauncher 0.1.0".
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: CPU, graphics card and screen
      description: e.g. "Ryzen 7 7800X3D, RTX 3060, 2560x1440 at 144 Hz".
  - type: checkboxes
    id: worked
    attributes:
      label: What worked?
      options:
        - label: The settings window opened
        - label: The intro and menus showed
        - label: A race loaded without the modern-CPU crash
        - label: A full race could be driven
        - label: Gamepad (steering, pedals, buttons)
        - label: Rumble
        - label: 4K / widescreen picture
        - label: The game closed cleanly
  - type: textarea
    id: settings
    attributes:
      label: Settings used
      description: The look and anything you changed, or launcher.cfg without personal paths.
  - type: textarea
    id: problems
    attributes:
      label: What went wrong (if anything)?
      description: What you did, what you expected and what happened.
  - type: textarea
    id: log
    attributes:
      label: launcher.log
      description: |
        Windows: %LOCALAPPDATA%\DiRTLauncher\launcher.log. Under Wine/Proton it is inside the prefix.
        Remove personal paths before posting.
      render: text
