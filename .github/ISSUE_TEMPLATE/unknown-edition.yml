name: Unknown edition
description: "SRRLauncher.exe said your SEGA Rally.exe or SEGA Rally_SSE1.exe is a build it does not know."
title: "Unknown edition: "
labels: ["edition"]
body:
  - type: markdown
    attributes:
      value: |
        The launcher only changes builds it has identified by SHA-256, so it refused yours and
        left it untouched. Tell us about your copy: a build we can verify is added. Some builds
        need a fix written for that exact file, so we may ask more about your copy first.
        Never attach or link game files.
  - type: textarea
    id: sha256
    attributes:
      label: SHA-256
      description: |
        The SHA-256 the launcher showed, and which file it was (SEGA Rally.exe or
        SEGA Rally_SSE1.exe); launcher.log has a line for each. A SHA-256 is 64 characters,
        digits 0-9 and letters a-f. Or run `sha256sum "SEGA Rally.exe"` (Linux) or
        `certutil -hashfile "SEGA Rally.exe" SHA256` (Windows).
      render: text
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where is your copy of the game from?
      options:
        - Retail DVD
        - Another store
        - Patched by hand (official or community patch)
        - Not sure
    validations:
      required: true
  - type: input
    id: size
    attributes:
      label: File size in bytes
      description: >-
        Of the file named above: Properties on Windows, or `stat -c %s "SEGA Rally.exe"` on
        Linux.
  - type: input
    id: details
    attributes:
      label: Version, language and patches
      description: e.g. "v4.0.6.0, English, no patches".
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: The first line of launcher.log, e.g. "SRRLauncher 0.1.1".
  - type: textarea
    id: log
    attributes:
      label: launcher.log
      description: Optional. Remove personal paths before posting.
      render: text
