[package]
name = "srr-launcher"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Runs the user's own copy of Sega Rally Revo (2007) on modern Windows and Linux"

[[bin]]
name = "SRRLauncher"
path = "src/main.rs"

[dependencies]
rea-launcher.workspace = true
# Takes the D3DX9 DLLs out of Microsoft's DirectX package (MIT).
cab = "0.6"

[target.'cfg(windows)'.dependencies]
rea-launcher-win32.workspace = true
rea-launcher-ui.workspace = true

# The palette test and the headless window tests (egui_kittest) run on the
# host and under sdk/scripts/wine-test.
[dev-dependencies]
rea-launcher-ui = { workspace = true, features = ["testing"] }
# Decodes the clean-room stutter fix's sites and cave in tests/pacer_disasm.rs
# (stack balance, preserved registers, exits).
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "instr_info", "nasm"] }
