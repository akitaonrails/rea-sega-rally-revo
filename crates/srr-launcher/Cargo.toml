[package]
name = "srr-launcher"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Runs the user's own copy of Sega Rally Revo (2007) on modern Windows and Linux"

[[bin]]
name = "SRRLauncher"
path = "src/main.rs"

[dependencies]
rea-launcher.workspace = true

[target.'cfg(windows)'.dependencies]
rea-launcher-win32.workspace = true
rea-launcher-ui.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow"] }

# The palette's contrast test runs on the host too.
[dev-dependencies]
rea-launcher-ui.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow"] }
